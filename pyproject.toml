[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-redeco-agent"
version = "0.1.1"
description = "Deterministic core of Stellar's REDECO (CONDUSEF) complaint-response agent, exposed as an A2A endpoint. Synthetic data only."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
stellar-redeco-agent = "stellar_redeco.server:main"

[tool.setuptools.packages.find]
where = ["src"]
